# ─────────────────────────────────────────────────────────────────────────────
# AutoCreator AI — AWS production infrastructure (CloudFormation)
#
#   Vercel (web) ──> ALB ──> ECS Fargate: api (1 task) ──> RDS PostgreSQL
#                                  └─ worker (1 task) ──> ElastiCache Redis
#                                        └─ renders ──> S3 (assets/renders/logs)
#   Secrets: AWS Secrets Manager (DATABASE_URL, REDIS_URL, JWT, AI keys…)
#   Logs: CloudWatch Log Groups (api + worker)
#   Storage: S3 buckets with lifecycle (renders expire after 90 days)
#
# Deploy: aws cloudformation deploy --stack-name autocreator-prod \
#   --template-file infra/aws/cloudformation.yml \
#   --capabilities CAPABILITY_NAMED_IAM \
#   --parameter-overrides ApiDomain=api.autocreator.ai CertificateArn=arn:aws:acm:...
# ─────────────────────────────────────────────────────────────────────────────
AWSTemplateFormatVersion: "2010-09-09"
Description: "AutoCreator AI — production API + Worker on ECS Fargate with RDS PostgreSQL, ElastiCache Redis, S3, Secrets Manager"

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  ApiImage:
    Type: String
    Description: ECR image URI for the API service
  WorkerImage:
    Type: String
    Description: ECR image URI for the worker service
  ApiCpu:
    Type: Number
    Default: 1024
  ApiMemory:
    Type: Number
    Default: 2048
  WorkerCpu:
    Type: Number
    Default: 1024
  WorkerMemory:
    Type: Number
    Default: 2048
  DesiredApiTasks:
    Type: Number
    Default: 1
  DesiredWorkerTasks:
    Type: Number
    Default: 1
  RdsInstanceClass:
    Type: String
    Default: db.t4g.small
  RdsStorageGb:
    Type: Number
    Default: 20
  RedisNodeType:
    Type: String
    Default: cache.t4g.small
  ApiDomain:
    Type: String
    Default: ""
    Description: Optional custom domain (route53 alias); empty = ALB DNS only
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for ApiDomain (required if ApiDomain set)
  SecretsPrefix:
    Type: String
    Default: "autocreator/prod"
    Description: Prefix for Secrets Manager secrets
  AuthJwtSecret:
    Type: String
    NoEcho: true
    MinLength: 64
    Description: Stable JWT signing secret supplied by the deployment workflow
  SecretsMasterKey:
    Type: String
    NoEcho: true
    MinLength: 64
    Description: Stable 32-byte hex envelope-encryption key

Resources:
  # ── VPC ───────────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${EnvironmentName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]

  NatGatewayEip:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable }
  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable }

  # ── Security groups ──────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB — HTTPS from internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API — ALB only + health from ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Worker — no inbound from internet
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL — API + worker only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WorkerSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis — API + worker only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ApiSecurityGroup
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref WorkerSecurityGroup

  # ── S3 (storage tier) ────────────────────────────────────────────────────
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autocreator-${AWS::AccountId}-assets"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldRenders
            Status: Enabled
            Prefix: renders/
            ExpirationInDays: 90
  RendersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autocreator-${AWS::AccountId}-renders"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autocreator-${AWS::AccountId}-logs"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: 30

  # ── RDS PostgreSQL (production DB) ───────────────────────────────────────
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "autocreator-${EnvironmentName}"
      Engine: postgres
      EngineVersion: "16.4"
      DBInstanceClass: !Ref RdsInstanceClass
      AllocatedStorage: !Ref RdsStorageGb
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 14
      MasterUsername: !Sub "{{resolve:secretsmanager:${SecretsPrefix}/db:SecretString:Username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${SecretsPrefix}/db:SecretString:Password}}"
      Tags: [{ Key: Name, Value: !Sub "autocreator-${EnvironmentName}-db" }]

  # ── ElastiCache Redis (production queue/rate-limit/idempotency) ─────────
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Redis subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      CacheClusterName: !Sub "autocreator-${EnvironmentName}"
      Engine: redis
      CacheNodeType: !Ref RedisNodeType
      NumCacheNodes: 1
      Port: 6379
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds: [!Ref RedisSecurityGroup]
      SnapshotRetentionLimit: 7
      Tags: [{ Key: Name, Value: !Sub "autocreator-${EnvironmentName}-redis" }]

  # ── Secrets Manager (runtime config — NEVER in git) ─────────────────────
  SecretsDatabase:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${SecretsPrefix}/db"
      GenerateSecretString:
        SecretStringTemplate: '{"Username":"aca_app"}'
        GenerateStringKey: Password
        ExcludePunctuation: true
        PasswordLength: 24
  SecretsRuntime:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${SecretsPrefix}/runtime"
      Description: "AutoCreator runtime secrets: DATABASE_URL, REDIS_URL, AUTH_JWT_SECRET, SECRETS_MASTER_KEY, AI keys, OAuth clients"
      SecretString: !Sub |
        {
          "DATABASE_URL": "postgresql://aca_app:{{resolve:secretsmanager:${SecretsPrefix}/db:SecretString:Password}}@${Database.Endpoint.Address}:5432/postgres",
          "REDIS_URL": "redis://${RedisCluster.RedisEndpoint.Address}:6379/0",
          "AUTH_JWT_SECRET": "${AuthJwtSecret}",
          "SECRETS_MASTER_KEY": "${SecretsMasterKey}",
          "OPENAI_API_KEY": "",
          "GROQ_API_KEY": "",
          "GEMINI_API_KEY": "",
          "RUNWAY_API_KEY": "",
          "LUMA_API_KEY": "",
          "FAL_KEY": "",
          "GOOGLE_CLIENT_ID": "",
          "GOOGLE_CLIENT_SECRET": "",
          "TIKTOK_CLIENT_KEY": "",
          "TIKTOK_CLIENT_SECRET": "",
          "META_APP_ID": "",
          "META_APP_SECRET": "",
          "STRIPE_SECRET_KEY": "",
          "STRIPE_WEBHOOK_SECRET": "",
          "PUBLIC_API_URL": ""
        }

  # ── ECS cluster + task roles ─────────────────────────────────────────────
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "autocreator-${EnvironmentName}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: autocreator-task-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "${AssetsBucket.Arn}"
                  - !Sub "${AssetsBucket.Arn}/*"
                  - !Sub "${RendersBucket.Arn}"
                  - !Sub "${RendersBucket.Arn}/*"
                  - !Sub "${LogsBucket.Arn}"
                  - !Sub "${LogsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref SecretsRuntime
                  - !Ref SecretsDatabase
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"

  # ── Load balancer ───────────────────────────────────────────────────────
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "autocreator-${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
