# ─────────────────────────────────────────────────────────────────────────────
# AutoCreator AI — AWS production infrastructure (CloudFormation)
#
#   Vercel (web) ──> ALB ──> ECS Fargate: api (1 task) ──> RDS PostgreSQL
#                                  └─ worker (1 task) ──> ElastiCache Redis
#                                        └─ renders ──> S3 (assets/renders/logs)
#   Secrets: AWS Secrets Manager (DATABASE_URL, REDIS_URL, JWT, AI keys…)
#   Logs: CloudWatch Log Groups (api + worker)
#   Storage: S3 buckets with lifecycle (renders expire after 90 days)
#
# Deploy: aws cloudformation deploy --stack-name autocreator-prod \
#   --template-file infra/aws/cloudformation.yml \
#   --capabilities CAPABILITY_NAMED_IAM \
#   --parameter-overrides DomainName=api.autocreator.ai CertificateArn=arn:aws:acm:...
# ─────────────────────────────────────────────────────────────────────────────
AWSTemplateFormatVersion: "2010-09-09"
Description: "AutoCreator AI — production API + Worker on ECS Fargate with RDS PostgreSQL, ElastiCache Redis, S3, Secrets Manager"

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  ApiImage:
    Type: String
    Description: ECR image URI for the API service
  WorkerImage:
    Type: String
    Description: ECR image URI for the worker service
  ApiCpu:
    Type: Number
    Default: 1024
  ApiMemory:
    Type: Number
    Default: 2048
  WorkerCpu:
    Type: Number
    Default: 1024
  WorkerMemory:
    Type: Number
    Default: 2048
  DesiredApiTasks:
    Type: Number
    Default: 1
  DesiredWorkerTasks:
    Type: Number
    Default: 1
  RdsInstanceClass:
    Type: String
    Default: db.t4g.small
  RdsStorageGb:
    Type: Number
    Default: 20
  RedisNodeType:
    Type: String
    Default: cache.t4g.small
  ApiDomain:
    Type: String
    Default: ""
    Description: Optional custom domain (route53 alias); empty = ALB DNS only
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for ApiDomain (required if ApiDomain set)
  SecretsPrefix:
    Type: String
    Default: "autocreator/prod"
    Description: Prefix for Secrets Manager secrets

Resources:
  # ── VPC ───────────────────────────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${EnvironmentName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]

  NatGatewayEip:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable }
  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable }

  # ── Security groups ──────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB — HTTPS from internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API — ALB only + health from ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Worker — no inbound from internet
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL — API + worker only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WorkerSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis — API + worker only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ApiSecurityGroup
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref WorkerSecurityGroup

  # ── S3 (storage tier) ────────────────────────────────────────────────────
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autocreator-${AWS::AccountId}-assets"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldRenders
            Status: Enabled
            Prefix: renders/
            ExpirationInDays: 90
  RendersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autocreator-${AWS::AccountId}-renders"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "autocreator-${AWS::AccountId}-logs"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: 30

  # ── RDS PostgreSQL (production DB) ───────────────────────────────────────
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "autocreator-${EnvironmentName}"
      Engine: postgres
      EngineVersion: "16.4"
      DBInstanceClass: !Ref RdsInstanceClass
      AllocatedStorage: !Ref RdsStorageGb
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 14
      MasterUsername: !Sub "{{resolve:secretsmanager:${SecretsPrefix}/db:Username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${SecretsPrefix}/db:Password}}"
      Tags: [{ Key: Name, Value: !Sub "autocreator-${EnvironmentName}-db" }]

  # ── ElastiCache Redis (production queue/rate-limit/idempotency) ─────────
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Redis subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      CacheClusterName: !Sub "autocreator-${EnvironmentName}"
      Engine: redis
      CacheNodeType: !Ref RedisNodeType
      NumCacheNodes: 1
      Port: 6379
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds: [!Ref RedisSecurityGroup]
      SnapshotRetentionLimit: 7
      Tags: [{ Key: Name, Value: !Sub "autocreator-${EnvironmentName}-redis" }]

  # ── Secrets Manager (runtime config — NEVER in git) ─────────────────────
  SecretsDatabase:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${SecretsPrefix}/db"
      GenerateSecretString:
        SecretStringTemplate: '{"Username":"aca_app"}'
        GenerateStringKey: Password
        ExcludePunctuation: true
        PasswordLength: 24
  SecretsRuntime:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${SecretsPrefix}/runtime"
      Description: "AutoCreator runtime secrets: DATABASE_URL, REDIS_URL, AUTH_JWT_SECRET, SECRETS_MASTER_KEY, AI keys, OAuth clients"
      SecretString: !Sub |
        {
          "DATABASE_URL": "postgresql://aca_app:{{resolve:secretsmanager:${SecretsPrefix}/db:SecretString:Password}}@${Database.Endpoint.Address}:5432/autocreator",
          "REDIS_URL": "redis://${RedisCluster.RedisEndpoint.Address}:6379/0",
          "AUTH_JWT_SECRET": "CHANGE_ME_64_HEX",
          "SECRETS_MASTER_KEY": "CHANGE_ME_64_HEX"
        }

  # ── ECS cluster + task roles ─────────────────────────────────────────────
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "autocreator-${EnvironmentName}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: autocreator-task-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "${AssetsBucket.Arn}"
                  - !Sub "${AssetsBucket.Arn}/*"
                  - !Sub "${RendersBucket.Arn}"
                  - !Sub "${RendersBucket.Arn}/*"
                  - !Sub "${LogsBucket.Arn}"
                  - !Sub "${LogsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref SecretsRuntime
                  - !Ref SecretsDatabase
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"

  # ── Load balancer ───────────────────────────────────────────────────────
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "autocreator-${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "autocreator-${EnvironmentName}-api-tg"
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref Vpc
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: 443, StatusCode: HTTP_301 }

  AlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # ── ECS services ────────────────────────────────────────────────────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/autocreator/${EnvironmentName}/api"
      RetentionInDays: 30
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/autocreator/${EnvironmentName}/worker"
      RetentionInDays: 30

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "autocreator-${EnvironmentName}-api"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      ExecutionRoleArn: !Ref TaskRole
      TaskRoleArn: !Ref TaskRole
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "3000" }
            - { Name: HOST, Value: "0.0.0.0" }
            - { Name: CORS_ORIGINS, Value: "https://autocreator.vercel.app,https://www.autocreator.ai" }
            - { Name: PUBLIC_WEB_URL, Value: "https://autocreator.vercel.app" }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Sub "${SecretsRuntime}:DATABASE_URL::" }
            - { Name: REDIS_URL, ValueFrom: !Sub "${SecretsRuntime}:REDIS_URL::" }
            - { Name: AUTH_JWT_SECRET, ValueFrom: !Sub "${SecretsRuntime}:AUTH_JWT_SECRET::" }
            - { Name: SECRETS_MASTER_KEY, ValueFrom: !Sub "${SecretsRuntime}:SECRETS_MASTER_KEY::" }
            - { Name: OPENAI_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:OPENAI_API_KEY::" }
            - { Name: GROQ_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:GROQ_API_KEY::" }
            - { Name: GEMINI_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:GEMINI_API_KEY::" }
            - { Name: RUNWAY_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:RUNWAY_API_KEY::" }
            - { Name: LUMA_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:LUMA_API_KEY::" }
            - { Name: FAL_KEY, ValueFrom: !Sub "${SecretsRuntime}:FAL_KEY::" }
            - { Name: GOOGLE_CLIENT_ID, ValueFrom: !Sub "${SecretsRuntime}:GOOGLE_CLIENT_ID::" }
            - { Name: GOOGLE_CLIENT_SECRET, ValueFrom: !Sub "${SecretsRuntime}:GOOGLE_CLIENT_SECRET::" }
            - { Name: TIKTOK_CLIENT_KEY, ValueFrom: !Sub "${SecretsRuntime}:TIKTOK_CLIENT_KEY::" }
            - { Name: TIKTOK_CLIENT_SECRET, ValueFrom: !Sub "${SecretsRuntime}:TIKTOK_CLIENT_SECRET::" }
            - { Name: META_APP_ID, ValueFrom: !Sub "${SecretsRuntime}:META_APP_ID::" }
            - { Name: META_APP_SECRET, ValueFrom: !Sub "${SecretsRuntime}:META_APP_SECRET::" }
            - { Name: STRIPE_SECRET_KEY, ValueFrom: !Sub "${SecretsRuntime}:STRIPE_SECRET_KEY::" }
            - { Name: STRIPE_WEBHOOK_SECRET, ValueFrom: !Sub "${SecretsRuntime}:STRIPE_WEBHOOK_SECRET::" }
            - { Name: PUBLIC_API_URL, ValueFrom: !Sub "${SecretsRuntime}:PUBLIC_API_URL::" }
            - { Name: S3_ACCESS_KEY_ID, ValueFrom: !Sub "${SecretsRuntime}:S3_ACCESS_KEY_ID::" }
            - { Name: S3_SECRET_ACCESS_KEY, ValueFrom: !Sub "${SecretsRuntime}:S3_SECRET_ACCESS_KEY::" }
            - { Name: S3_BUCKET, ValueFrom: !Sub "${SecretsRuntime}:S3_BUCKET::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "autocreator-${EnvironmentName}-worker"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      ExecutionRoleArn: !Ref TaskRole
      TaskRoleArn: !Ref TaskRole
      ContainerDefinitions:
        - Name: worker
          Image: !Ref WorkerImage
          Essential: true
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "8080" }
            - { Name: HOST, Value: "0.0.0.0" }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Sub "${SecretsRuntime}:DATABASE_URL::" }
            - { Name: REDIS_URL, ValueFrom: !Sub "${SecretsRuntime}:REDIS_URL::" }
            - { Name: AUTH_JWT_SECRET, ValueFrom: !Sub "${SecretsRuntime}:AUTH_JWT_SECRET::" }
            - { Name: SECRETS_MASTER_KEY, ValueFrom: !Sub "${SecretsRuntime}:SECRETS_MASTER_KEY::" }
            - { Name: OPENAI_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:OPENAI_API_KEY::" }
            - { Name: GROQ_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:GROQ_API_KEY::" }
            - { Name: GEMINI_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:GEMINI_API_KEY::" }
            - { Name: RUNWAY_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:RUNWAY_API_KEY::" }
            - { Name: LUMA_API_KEY, ValueFrom: !Sub "${SecretsRuntime}:LUMA_API_KEY::" }
            - { Name: FAL_KEY, ValueFrom: !Sub "${SecretsRuntime}:FAL_KEY::" }
            - { Name: PUBLIC_API_URL, ValueFrom: !Sub "${SecretsRuntime}:PUBLIC_API_URL::" }
            - { Name: S3_ACCESS_KEY_ID, ValueFrom: !Sub "${SecretsRuntime}:S3_ACCESS_KEY_ID::" }
            - { Name: S3_SECRET_ACCESS_KEY, ValueFrom: !Sub "${SecretsRuntime}:S3_SECRET_ACCESS_KEY::" }
            - { Name: S3_BUCKET, ValueFrom: !Sub "${SecretsRuntime}:S3_BUCKET::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  ApiService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub "autocreator-${EnvironmentName}-api"
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref DesiredApiTasks
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApiSecurityGroup]
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 3000
          TargetGroupArn: !Ref AlbTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      DeploymentController: { Type: ECS }

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub "autocreator-${EnvironmentName}-worker"
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: !Ref DesiredWorkerTasks
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref WorkerSecurityGroup]
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      DeploymentController: { Type: ECS }

  # ── DNS (optional custom domain) ────────────────────────────────────────
  ApiDns:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneName: !Sub "${ApiDomain}."
      Name: !Ref ApiDomain
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt LoadBalancer.DNSName

Conditions:
  HasDomain: !Not [!Equals [!Ref ApiDomain, ""]]

Outputs:
  ApiUrl:
    Description: API base URL
    Value: !If [HasDomain, !Sub "https://${ApiDomain}", !Sub "http://${LoadBalancer.DNSName}"]
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
  AssetsBucket:
    Value: !Ref AssetsBucket
  RendersBucket:
    Value: !Ref RendersBucket
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  RedisEndpoint:
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
  ClusterName:
    Value: !Ref Cluster
