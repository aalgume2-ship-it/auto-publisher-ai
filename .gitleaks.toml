title = "AutoCreator AI — gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Design docs contain endpoint/var names, not secrets"
paths = [
  '''^docs/''',
  '''^\.env\.example$''',
  '''\.md$''',
  '''_test\.json$''',
  '''\.cassette\.json$''',
]

[[rules]]
id = "aca-token-shape"
description = "AutoCreator API key shape"
regex = '''aca_live_[A-Za-z0-9]{32}'''
entropy = 4.0

[[rules]]
id = "generic-secret-assignment"
description = "Catch accidental real values in config-like files"
regex = '''(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["']?[A-Za-z0-9_\-/+]{20,}["']?'''
entropy = 4.2
[rules.allowlist]
paths = ['''^docs/''', '''^\.env\.example$''']
