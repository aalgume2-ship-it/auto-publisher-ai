# Fly.io alternative for the API host (web stays on Vercel).
# Deploy: fly launch --no-deploy && fly deploy  (then set secrets with fly secrets set)
app = "autocreator-api"
primary_region = "fra"

[build]
  builder = "heroku/buildpacks:20"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[experimental]
  auto_rollback = true

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "aca_storage"
  destination = "/data/aca-storage"

# Secrets (set via `fly secrets set`):
#   DATABASE_URL (Neon), REDIS_URL (Upstash), AUTH_JWT_SECRET,
#   AI_PROVIDER_MODE=demo, SEED_ADMIN_ON_BOOT=true, SEED_ADMIN_EMAIL/PASSWORD
