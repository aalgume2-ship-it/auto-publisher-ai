<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساعد أعمال قوى</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>body{font-family:Tahoma,Arial;background:#f4f7f6;color:#10251f;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #dfe7e3;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 150px auto;gap:10px;align-items:end}.btn{background:#1fa576;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:bold}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #dfe7e3;border-radius:14px;padding:16px}.card b{display:block;font-size:30px;margin-top:8px}.task{padding:12px 0;border-bottom:1px solid #edf1ef}.muted{color:#6b7973;font-size:13px}.ok{color:#146445}.bad{color:#922}@media(max-width:800px){.row,.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>مساعد أعمال قوى</h1><div class="panel"><h3>رفع تقرير تجديد الإقامات</h3><div class="row"><label>ملف Excel<input id="file" type="file" accept=".xlsx,.xls" style="display:block;margin-top:7px"></label><label>قبل الانتهاء بـ<input id="lead" type="number" min="0" max="30" value="3" style="width:100%;padding:8px;margin-top:7px"></label><button class="btn" onclick="importFile()">رفع وجدولة</button></div><p class="muted">يدعم ملفك الحالي حتى لو كانت العناوين في الصف السادس، ويتعرف على: الاسم، رقم الهوية، تاريخ انتهاء الهوية.</p><div id="msg" class="muted">ارفع الملف كما هو بدون تعديل.</div></div><div class="cards"><div class="card">إجمالي الموظفين<b id="total">0</b></div><div class="card">مستحق الآن<b id="due">0</b></div><div class="card">خلال 30 يوم<b id="soon">0</b></div></div><div class="panel" style="margin-top:14px"><h3>جدول الموظفين</h3><div id="list" class="muted">لا توجد بيانات بعد.</div></div></div><script>const KEY='qiwa_schedule_v4';let data=JSON.parse(localStorage.getItem(KEY)||'[]');const $=x=>document.getElementById(x);function n(s){return String(s??'').trim().toLowerCase().replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/\s+/g,' ')}function pd(v){if(v instanceof Date&&!isNaN(v))return v;if(typeof v==='number'){const z=XLSX.SSF.parse_date_code(v);if(z)return new Date(z.y,z.m-1,z.d)}const d=new Date(v);return isNaN(d)?null:d}function ymd(d){return d?new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10):''}function act(exp,lead){const d=new Date(exp+'T12:00:00');d.setDate(d.getDate()-lead);return ymd(d)}function header(grid){for(let r=0;r<Math.min(25,grid.length);r++){const a=(grid[r]||[]).map(n);let id=-1,ex=-1,name=-1;for(let c=0;c<a.length;c++){if(id<0&&(a[c].includes('رقم الهويه')||a[c].includes('رقم الاقامه')))id=c;if(ex<0&&(a[c].includes('تاريخ انتهاء الهويه')||a[c].includes('تاريخ انتهاء الاقامه')||a[c]==='تاريخ الانتهاء'))ex=c;if(name<0&&a[c]==='الاسم')name=c}if(id>=0&&ex>=0)return{r,id,ex,name}}return null}async function importFile(){const f=$('file').files[0];if(!f){$('msg').textContent='اختر الملف أولاً.';return}try{const lead=Math.max(0,Math.min(30,Number($('lead').value||3)));const b=await f.arrayBuffer();const wb=XLSX.read(b,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const g=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});const h=header(g);if(!h)throw new Error('لم أجد صف العناوين');const out=[];for(let r=h.r+1;r<g.length;r++){const row=g[r]||[];const id=String(row[h.id]??'').replace(/\.0$/,'').trim();const d=pd(row[h.ex]);if(!id||!d)continue;const ex=ymd(d);out.push({id,name:h.name>=0?String(row[h.name]??'').trim():'',expiry:ex,action:act(ex,lead),lead})}if(!out.length)throw new Error('لم أجد موظفين صالحين');const m=new Map(data.map(x=>[x.id,x]));out.forEach(x=>m.set(x.id,x));data=[...m.values()].sort((a,b)=>a.action.localeCompare(b.action));localStorage.setItem(KEY,JSON.stringify(data));$('msg').innerHTML='<span class="ok">تم استيراد '+out.length+' موظف. تم اكتشاف صف العناوين رقم '+(h.r+1)+' تلقائياً.</span>';render()}catch(e){$('msg').innerHTML='<span class="bad">تعذر الاستيراد: '+e.message+'</span>'}}function render(){const today=ymd(new Date());const d30=new Date();d30.setDate(d30.getDate()+30);const due=data.filter(x=>x.action<=today);const soon=data.filter(x=>new Date(x.expiry+'T12:00:00')>=new Date(today+'T00:00:00')&&new Date(x.expiry+'T12:00:00')<=d30);$('total').textContent=data.length;$('due').textContent=due.length;$('soon').textContent=soon.length;$('list').innerHTML=data.length?data.map(x=>'<div class="task"><b>'+(x.name||x.id)+'</b><div class="muted">رقم الهوية: '+x.id+' | الانتهاء: '+x.expiry+' | موعد الإجراء: '+x.action+' | قبلها بـ '+x.lead+' أيام</div></div>').join(''):'لا توجد بيانات بعد.'}render();</script></body></html>
