# Render Blueprint — one-click PREVIEW deployment of AutoCreator AI (Module 1).
# docs/Deployment.md §preview-on-render is the normative doc.
#
# How to deploy (no local tooling, ~5 minutes):
#   1. https://dashboard.render.com → New → Blueprint
#   2. Connect this repo (aalgume2-ship-it/auto-publisher-ai) → Render reads
#      this file and provisions: web service + managed Postgres 16 + KeyValue.
#   3. Watch the deploy log; when Live, the API is at the service's *.onrender.com URL.
#   4. Mint a demo session JWT from the Render Shell tab of the web service:
#        node infra/scripts/mint-dev-token.mjs
#      (demo-org seeds because NODE_ENV=development — see note below; for a
#      real staging cut set NODE_ENV=production which skips demo data entirely.)
#
# Free-plan caveats (Render, not us): web services sleep after 15 min idle
# (first request after sleep is a cold start), free Postgres expires after 90
# days, and free KeyValue is 25 MB noeviction — plenty for a preview.

services:
  - type: web
    name: autocreator-api-preview
    runtime: node
    plan: free
    region: oregon
    # pnpm 9.15.9 is the pinned package manager (package.json packageManager);
    # --no-frozen-lockfile mirrors CI until pnpm-lock.yaml is committed.
    buildCommand: >-
      corepack enable && corepack prepare pnpm@9.15.9 --activate &&
      pnpm install --no-frozen-lockfile &&
      pnpm db:generate &&
      pnpm build
    # Order matters: pgvector first (schema requires it), then the schema,
    # then the catalog + demo seed. All three steps are idempotent.
    preDeployCommand: >-
      node infra/scripts/ensure-vector.mjs &&
      pnpm --filter @aca/database exec prisma db push --skip-generate &&
      pnpm db:seed
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: development      # demo-org + demo user seed ONLY outside production (Database.md §7)
      - key: DATABASE_URL
        fromDatabase:
          name: autocreator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autocreator-redis
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true     # per-deployment secret, managed by Render
      - key: TRUST_PROXY
        value: 'true'           # sit behind Render's load balancer (X-Forwarded-For per-client rate limits)
      # PORT: Render injects it (default 10000) — config maps PORT→http.port;
      # host defaults to 0.0.0.0. Nothing else required to boot.

  - type: keyvalue
    name: autocreator-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction  # rate-limit/idempotency buckets — matches docker-compose policy

databases:
  - name: autocreator-db
    plan: free
    databaseName: autocreator
    user: aca
    postgresMajorVersion: '16'   # pgvector installable; ensure-vector.mjs enables it pre-push
    ipAllowList: []              # services-only ingress (database is not public)
