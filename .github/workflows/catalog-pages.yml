name: Deploy Product Catalog

on:
  push:
    branches: [main]
    paths:
      - 'catalog-store/**'
      - '.github/workflows/catalog-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload catalog
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalog-store
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
