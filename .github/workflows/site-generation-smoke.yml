name: site-generation-smoke

# End-to-end production proof: the request must pass through the public Vercel site.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-generation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-through-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_ORIGIN: https://auto-publisher-ai-web.vercel.app
    steps:
      - name: Install video verifier
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/video-checker"
          mkdir -p "$CHECK_DIR"
          cd "$CHECK_DIR"
          npm init -y >/dev/null
          npm install --silent ffprobe-static@3.1.0
          FFPROBE_BIN="$(node -p "require('ffprobe-static').path")"
          test -x "$FFPROBE_BIN"
          echo "$(dirname "$FFPROBE_BIN")" >> "$GITHUB_PATH"

      - name: Verify deployed site and API proxy
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 3 "$SITE_ORIGIN/" >/dev/null
          curl -fLsS --retry 4 --retry-delay 3 "$SITE_ORIGIN/api/v1/health/live"
          curl -fLsS --retry 4 --retry-delay 3 "$SITE_ORIGIN/api/v1/health/ready"

      - name: Create real temporary site session
        id: auth
        run: |
          set -euo pipefail
          ID="$(date +%s)-$RANDOM"
          EMAIL="site-smoke-$ID@trial.lumen.app"
          PASSWORD="Smoke${ID//-/}Aa9!xZ7#"
          BODY=$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" --arg n "Site Smoke $ID" '{email:$e,password:$p,displayName:$n,locale:"en",timezone:"Asia/Riyadh"}')
          RESP=$(curl -fLsS -H 'content-type: application/json' -H "Idempotency-Key: auth-$ID" -d "$BODY" "$SITE_ORIGIN/api/v1/auth/register")
          TOKEN=$(jq -r '.tokens.accessToken // empty' <<<"$RESP")
          ORG=$(jq -r '.workspace.id // empty' <<<"$RESP")
          test -n "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "org=$ORG" >> "$GITHUB_OUTPUT"

      - name: Resolve workspace and create project
        id: project
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG0: ${{ steps.auth.outputs.org }}
        run: |
          set -euo pipefail
          ORG="$ORG0"
          if [ -z "$ORG" ]; then
            ORGS=$(curl -fLsS -H "Authorization: Bearer $TOKEN" "$SITE_ORIGIN/api/v1/organizations")
            ORG=$(jq -r '.items[0].organization.id // empty' <<<"$ORGS")
          fi
          SERIES_BODY='{"name":"مدينة الحوت الطائر","niche":"cinematic story","language":"ar"}'
          SERIES=$(curl -fLsS -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: series-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -d "$SERIES_BODY" "$SITE_ORIGIN/api/v1/organizations/$ORG/series")
          SERIES_ID=$(jq -r '.id' <<<"$SERIES")
          test -n "$SERIES_ID"
          echo "org=$ORG" >> "$GITHUB_OUTPUT"
          echo "series=$SERIES_ID" >> "$GITHUB_OUTPUT"

      - name: Generate real AI video through website API route
        id: video
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG: ${{ steps.project.outputs.org }}
          SERIES: ${{ steps.project.outputs.series }}
        run: |
          set -euo pipefail
          PROMPT='A brave Arab child runs across moonlit rooftops in a cinematic Middle Eastern city, then leaps onto a luminous flying whale soaring through fast-moving clouds, realistic character and fabric motion, dynamic tracking camera, dramatic blue moonlight, one continuous shot, no text'
          BODY=$(jq -nc --arg k "$PROMPT" '{keyword:$k,targetSeconds:20}')
          TMP=$(mktemp)
          STATUS=$(curl -LsS -o "$TMP" -w '%{http_code}' -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: neon-video-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -d "$BODY" "$SITE_ORIGIN/api/v1/organizations/$ORG/series/$SERIES/videos")
          RESP=$(cat "$TMP"); rm -f "$TMP"
          echo "$RESP" | jq '{id:(.video.id // .id),status:(.video.status // .status),title,detail,code}' 2>/dev/null || printf '%s\n' "$RESP" | head -c 1000
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
          VIDEO_ID=$(jq -r '.video.id // .id // empty' <<<"$RESP")
          test -n "$VIDEO_ID"
          echo "id=$VIDEO_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for READY and verify generated MP4 byte-for-byte
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG: ${{ steps.project.outputs.org }}
          VIDEO_ID: ${{ steps.video.outputs.id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while [ $SECONDS -lt $deadline ]; do
            R=$(curl -fLsS -H "Authorization: Bearer $TOKEN" "$SITE_ORIGIN/api/v1/organizations/$ORG/videos/$VIDEO_ID")
            STATUS=$(jq -r '.status // empty' <<<"$R")
            echo "status=$STATUS"
            if [ "$STATUS" = "READY" ]; then
              MOTION_MODE=$(jq -r '.seo.motionMode // empty' <<<"$R")
              echo "motion_mode=${MOTION_MODE:-missing}"
              test "$MOTION_MODE" = "ai-video"
              : > neon-ai-video.mp4
              START=0
              TOTAL=-1
              EXPECTED_SHA=''
              SOURCE=''
              while [ "$TOTAL" -lt 0 ] || [ "$START" -lt "$TOTAL" ]; do
                CHUNK=$(curl -fLsS --retry 3 -H "Authorization: Bearer $TOKEN" \
                  "$SITE_ORIGIN/api/v1/organizations/$ORG/videos/$VIDEO_ID/stream-chunk?start=$START&size=524286")
                CHUNK_START=$(jq -r '.start' <<<"$CHUNK")
                CHUNK_END=$(jq -r '.end' <<<"$CHUNK")
                TOTAL=$(jq -r '.total' <<<"$CHUNK")
                test "$CHUNK_START" -eq "$START"
                if [ "$START" -eq 0 ]; then
                  SOURCE=$(jq -r '.source // "unknown"' <<<"$CHUNK")
                  EXPECTED_SHA=$(jq -r '.sha256 // empty' <<<"$CHUNK")
                  echo "stream_source=$SOURCE total=$TOTAL expected_sha256=${EXPECTED_SHA:-missing}"
                fi
                jq -r '.base64' <<<"$CHUNK" | base64 --decode >> neon-ai-video.mp4
                START=$CHUNK_END
              done
              test "$(stat -c%s neon-ai-video.mp4)" -gt 30000
              test "$(stat -c%s neon-ai-video.mp4)" -eq "$TOTAL"
              ACTUAL_SHA=$(sha256sum neon-ai-video.mp4 | awk '{print $1}')
              echo "actual_sha256=$ACTUAL_SHA"
              if [ -n "$EXPECTED_SHA" ]; then test "$ACTUAL_SHA" = "$EXPECTED_SHA"; fi
              file neon-ai-video.mp4
              ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height,duration \
                -show_entries format=format_name,duration,size -of json neon-ai-video.mp4 | tee ffprobe.json
              jq -e '.streams | any(.codec_type == "video")' ffprobe.json >/dev/null
              jq -e '(.format.duration | tonumber) > 0' ffprobe.json >/dev/null
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "$R" | jq '{status,failureReason,seo}'
              exit 1
            fi
            sleep 5
          done
          exit 1

      - name: Upload generated video proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-ai-video
          path: |
            neon-ai-video.mp4
            ffprobe.json
          if-no-files-found: warn
          retention-days: 7
