name: fix-hf-ltx-source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hf-ltx-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair escaped TypeScript block
        run: |
          python3 -c "from pathlib import Path; p=Path('packages/video-engine/src/ai/providers-video.ts'); s=p.read_text(); a=s.index('const sleep = (ms: number) => new Promise((r) => setTimeout(r, ms));'); b=s.index('/* ----------------------------------------------------------- POLLINATIONS */'); r=s[a:b]; r=r.replace('sse.split(/\\\\\\\\r?\\\\\\\\n/)', '__LTX_SPLIT__'); r=r.replace('\\\\n', '\n'); r=r.replace('__LTX_SPLIT__', 'sse.split(/\\\\r?\\\\n/)'); p.write_text(s[:a]+r+s[b:])"
          git diff --check
      - name: Validate TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @aca/video-engine typecheck
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/video-engine/src/ai/providers-video.ts
          if git diff --cached --quiet; then
            echo 'Already repaired'
          else
            git commit -m 'fix(video): repair keyless LTX provider implementation'
            git push origin HEAD:main
          fi
