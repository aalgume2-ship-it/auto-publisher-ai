name: fix-hf-ltx-source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hf-ltx-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Register keyless LTX provider
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('packages/video-engine/src/ai/providers-video.ts'); s=p.read_text(); marker='export const VIDEO_PROVIDERS: readonly VideoProviderDef[] = [\\n'; block=\"  {\\n    id: 'hf-ltx',\\n    label: 'LTX-2.3 ZeroGPU',\\n    model: 'ltx-2.3',\\n    consoleUrl: 'https://huggingface.co/spaces/Lightricks/LTX-2.3',\\n    priceHint: 'free shared ZeroGPU; no API key required',\\n    envKey: '',\\n    supportsFirstFrame: false,\\n    supportedDurations: [1, 2, 3, 4, 5],\\n  },\\n\"; a=s.index(marker); b=s.index('] as const;', a); section=s[a:b]; p.write_text(s if \"id: 'hf-ltx'\" in section else s.replace(marker, marker+block, 1))"
          git diff --check
      - name: Validate workspace
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/video-engine/src/ai/providers-video.ts
          if git diff --cached --quiet; then
            echo 'LTX provider already registered'
          else
            git commit -m 'fix(video): register keyless LTX provider for production'
            git push origin HEAD:main
          fi
