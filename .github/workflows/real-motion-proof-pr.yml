name: real-motion-proof-pr

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/real-motion-proof-pr.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_ORIGIN: https://auto-publisher-ai-web.vercel.app
    steps:
      - name: Ensure verifier
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null

      - name: Verify production health
        run: |
          set -euo pipefail
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 "$SITE_ORIGIN/api/v1/health/live"
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 "$SITE_ORIGIN/api/v1/health/ready"

      - name: Create isolated session
        id: auth
        run: |
          set -euo pipefail
          ID="${GITHUB_RUN_ID}-${RANDOM}"
          EMAIL="real-motion-${ID}@trial.lumen.app"
          PASSWORD="Real${ID}Aa9!xZ7#"
          BODY=$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" --arg n "Real Motion $ID" '{email:$e,password:$p,displayName:$n,locale:"ar",timezone:"Asia/Riyadh"}')
          RESP=$(curl -fLsS -H 'content-type: application/json' -H "Idempotency-Key: auth-$ID" -d "$BODY" "$SITE_ORIGIN/api/v1/auth/register")
          TOKEN=$(jq -r '.tokens.accessToken // empty' <<<"$RESP")
          ORG=$(jq -r '.workspace.id // empty' <<<"$RESP")
          test -n "$TOKEN"
          test -n "$ORG"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "org=$ORG" >> "$GITHUB_OUTPUT"

      - name: Request genuine AI-motion story
        id: video
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG: ${{ steps.auth.outputs.org }}
        run: |
          set -euo pipefail
          SERIES_BODY='{"name":"اختبار الحركة الحقيقية","niche":"cinematic realistic short story","language":"ar"}'
          SERIES=$(curl -fLsS -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: series-${GITHUB_RUN_ID}" -d "$SERIES_BODY" "$SITE_ORIGIN/api/v1/organizations/$ORG/series")
          SERIES_ID=$(jq -r '.id // empty' <<<"$SERIES")
          test -n "$SERIES_ID"
          PROMPT='شاب عربي في سوق ليلي ممطر يلاحظ كاميرا قديمة على طاولة خشبية، يمد يده ويلتقطها ثم يرفعها أمام عينيه، الناس في الخلفية يمشون فعلياً والمظلات تتحرك والانعكاسات تتغير مع حركة الكاميرا. photorealistic live action, natural human body motion, realistic hands and face, cinematic dolly-in, foreground parallax, wet neon reflections, identity lock, no still frame, no slideshow, no zoom-pan fake motion, no text, no watermark.'
          BODY=$(jq -nc --arg k "$PROMPT" '{keyword:$k,targetSeconds:20}')
          RESP=$(curl -fLsS -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: video-${GITHUB_RUN_ID}" -d "$BODY" "$SITE_ORIGIN/api/v1/organizations/$ORG/series/$SERIES_ID/videos")
          VIDEO_ID=$(jq -r '.video.id // .id // empty' <<<"$RESP")
          test -n "$VIDEO_ID"
          echo "id=$VIDEO_ID" >> "$GITHUB_OUTPUT"
          echo "video_id=$VIDEO_ID" | tee video-id.txt

      - name: Wait for READY and verify exact MP4
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          ORG: ${{ steps.auth.outputs.org }}
          VIDEO_ID: ${{ steps.video.outputs.id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1500))
          while [ $SECONDS -lt $deadline ]; do
            R=$(curl -fLsS -H "Authorization: Bearer $TOKEN" "$SITE_ORIGIN/api/v1/organizations/$ORG/videos/$VIDEO_ID")
            STATUS=$(jq -r '.status // empty' <<<"$R")
            STEP=$(jq -r '.seo.step // empty' <<<"$R")
            PROGRESS=$(jq -r '.seo.progress // empty' <<<"$R")
            echo "status=$STATUS step=$STEP progress=$PROGRESS"
            if [ "$STATUS" = "READY" ]; then
              printf '%s\n' "$R" > final-video.json
              : > real-motion-final.mp4
              START=0
              TOTAL=-1
              EXPECTED_SHA=''
              while [ "$TOTAL" -lt 0 ] || [ "$START" -lt "$TOTAL" ]; do
                CHUNK=$(curl -fLsS --retry 5 --retry-all-errors -H "Authorization: Bearer $TOKEN" "$SITE_ORIGIN/api/v1/organizations/$ORG/videos/$VIDEO_ID/stream-chunk?start=$START&size=524286")
                CHUNK_START=$(jq -r '.start' <<<"$CHUNK")
                CHUNK_END=$(jq -r '.end' <<<"$CHUNK")
                TOTAL=$(jq -r '.total' <<<"$CHUNK")
                test "$CHUNK_START" -eq "$START"
                if [ "$START" -eq 0 ]; then EXPECTED_SHA=$(jq -r '.sha256 // empty' <<<"$CHUNK"); fi
                jq -r '.base64' <<<"$CHUNK" | base64 --decode >> real-motion-final.mp4
                START=$CHUNK_END
              done
              SIZE=$(stat -c%s real-motion-final.mp4)
              test "$SIZE" -eq "$TOTAL"
              test "$SIZE" -gt 100000
              ACTUAL_SHA=$(sha256sum real-motion-final.mp4 | awk '{print $1}')
              test -z "$EXPECTED_SHA" || test "$ACTUAL_SHA" = "$EXPECTED_SHA"
              ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height,avg_frame_rate,duration -show_entries format=format_name,duration,size -of json real-motion-final.mp4 | tee ffprobe.json
              jq -e '.streams | any(.codec_type == "video")' ffprobe.json >/dev/null
              jq -e '(.format.duration | tonumber) >= 5' ffprobe.json >/dev/null
              mkdir -p frames
              ffmpeg -v error -i real-motion-final.mp4 -vf "fps=2,scale=180:-1" -frames:v 12 frames/frame-%02d.png
              sha256sum frames/*.png | tee frame-hashes.txt
              UNIQUE=$(awk '{print $1}' frame-hashes.txt | sort -u | wc -l)
              test "$UNIQUE" -ge 4
              ffmpeg -v error -i real-motion-final.mp4 -vf "select='gt(scene,0.025)',metadata=print:file=scene-motion.txt" -an -f null - || true
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELLED" ]; then
              printf '%s\n' "$R" | tee failed-video.json
              jq '{status,failureReason,seo}' failed-video.json
              exit 1
            fi
            sleep 6
          done
          echo 'Timed out waiting for genuine motion video'
          exit 1

      - name: Upload genuine-motion proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-motion-final-video
          path: |
            real-motion-final.mp4
            ffprobe.json
            frame-hashes.txt
            scene-motion.txt
            final-video.json
            video-id.txt
            frames/*.png
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-motion-failure-diagnostics
          path: |
            failed-video.json
            video-id.txt
          if-no-files-found: ignore
          retention-days: 3
