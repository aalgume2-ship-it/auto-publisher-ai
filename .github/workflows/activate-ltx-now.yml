name: activate-ltx-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-ltx-now.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  STACK_NAME: autocreator-prod
  WORKER_REPOSITORY: autocreator/worker
  SITE_ORIGIN: https://auto-publisher-ai-web.vercel.app

jobs:
  activate-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Register keyless LTX as the first free moving-video provider
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('packages/video-engine/src/ai/providers-video.ts')
          s=p.read_text()
          marker='export const VIDEO_PROVIDERS: readonly VideoProviderDef[] = [\n'
          block="""  {
    id: 'hf-ltx',
    label: 'LTX-2.3 ZeroGPU',
    model: 'ltx-2.3',
    consoleUrl: 'https://huggingface.co/spaces/Lightricks/LTX-2.3',
    priceHint: 'free shared ZeroGPU; no API key required',
    envKey: '',
    supportsFirstFrame: false,
    supportedDurations: [1, 2, 3, 4, 5],
  },
"""
          if "id: 'hf-ltx'" not in s.split('] as const;',1)[0]:
              s=s.replace(marker, marker+block, 1)
              p.write_text(s)
          PY
          git diff --check

      - name: Validate workspace
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm typecheck
          pnpm build

      - name: Commit provider activation
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/video-engine/src/ai/providers-video.ts
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'fix(video): register keyless LTX provider for production'
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify production stack is stable and discover worker service
        id: aws
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
          echo "stack=$STATUS"
          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
            *) echo "Refusing deployment while stack is not stable: $STATUS"; exit 1;;
          esac
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          output() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text; }
          CLUSTER=$(output ClusterName)
          WORKER_SERVICE=$(output WorkerServiceName)
          test -n "$CLUSTER" && test "$CLUSTER" != "None"
          test -n "$WORKER_SERVICE" && test "$WORKER_SERVICE" != "None"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"
          echo "worker_service=$WORKER_SERVICE" >> "$GITHUB_OUTPUT"

      - name: Build and push worker with LTX support
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr describe-repositories --repository-names "$WORKER_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$WORKER_REPOSITORY" --region "$AWS_REGION" >/dev/null
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          WORKER_IMAGE="${REGISTRY}/${WORKER_REPOSITORY}:ltx-${SOURCE_SHA}"
          docker build --pull -f Dockerfile.worker -t "$WORKER_IMAGE" .
          docker push "$WORKER_IMAGE"
          echo "WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

      - name: Deploy worker image without touching RDS Redis Secrets or CloudFormation resources
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLUSTER: ${{ steps.aws.outputs.cluster }}
          SERVICE: ${{ steps.aws.outputs.worker_service }}
        run: |
          set -euo pipefail
          OLD_TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$OLD_TD" --region "$AWS_REGION" --query 'taskDefinition' > /tmp/td.json
          jq --arg img "$WORKER_IMAGE" '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
            .containerDefinitions = (.containerDefinitions | map(if .name == "worker" then .image=$img else . end))
          ' /tmp/td.json > /tmp/new-td.json
          if ! jq -e --arg img "$WORKER_IMAGE" '.containerDefinitions[] | select(.name=="worker" and .image==$img)' /tmp/new-td.json >/dev/null; then
            echo 'Worker container name not found in task definition'; jq -r '.containerDefinitions[].name' /tmp/td.json; exit 1
          fi
          NEW_TD=$(aws ecs register-task-definition --region "$AWS_REGION" --cli-input-json file:///tmp/new-td.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_TD" --force-new-deployment --region "$AWS_REGION" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$AWS_REGION" --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition}'

      - name: Generate real AI video through the public website
        id: generate
        run: |
          set -euo pipefail
          curl -fLsS --retry 5 --retry-delay 3 "$SITE_ORIGIN/api/v1/health/ready" >/dev/null
          ID="$(date +%s)-$RANDOM"
          EMAIL="ltx-smoke-$ID@trial.lumen.app"
          PASSWORD="Ltx${ID//-/}Aa9!xZ7#"
          AUTH_BODY=$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p,displayName:"LTX Production Smoke",locale:"en",timezone:"Asia/Riyadh"}')
          AUTH=$(curl -fLsS -H 'content-type: application/json' -H "Idempotency-Key: auth-$ID" -d "$AUTH_BODY" "$SITE_ORIGIN/api/v1/auth/register")
          TOKEN=$(jq -r '.tokens.accessToken // empty' <<<"$AUTH")
          ORG=$(jq -r '.workspace.id // empty' <<<"$AUTH")
          test -n "$TOKEN" && test -n "$ORG"
          SERIES_BODY='{"name":"LTX Neon Test","niche":"cinematic","cadencePerWeek":1,"language":"en"}'
          SERIES_RESP=$(curl -fLsS -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: series-${GITHUB_RUN_ID}" -d "$SERIES_BODY" "$SITE_ORIGIN/api/v1/organizations/$ORG/series")
          SERIES=$(jq -r '.id' <<<"$SERIES_RESP")
          PROMPT='Neon city at night, smooth lateral tracking shot following the subject, strong parallax, wet reflections and cinematic motion'
          BODY=$(jq -nc --arg k "$PROMPT" '{keyword:$k,targetSeconds:10}')
          RESP=$(curl -fLsS -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: video-${GITHUB_RUN_ID}" -d "$BODY" "$SITE_ORIGIN/api/v1/organizations/$ORG/series/$SERIES/videos")
          VIDEO_ID=$(jq -r '.video.id // .id // empty' <<<"$RESP")
          test -n "$VIDEO_ID"
          deadline=$((SECONDS + 2400))
          while [ $SECONDS -lt $deadline ]; do
            R=$(curl -fLsS -H "Authorization: Bearer $TOKEN" "$SITE_ORIGIN/api/v1/organizations/$ORG/videos/$VIDEO_ID")
            STATUS=$(jq -r '.status // empty' <<<"$R")
            STEP=$(jq -r '.seo.step // ""' <<<"$R")
            PROGRESS=$(jq -r '.seo.progress // ""' <<<"$R")
            echo "status=$STATUS progress=$PROGRESS step=$STEP"
            if [ "$STATUS" = "READY" ]; then
              curl -fLsS --retry 3 -H "Authorization: Bearer $TOKEN" "$SITE_ORIGIN/api/v1/organizations/$ORG/videos/$VIDEO_ID/stream" -o neon-ltx-production.mp4
              test "$(stat -c%s neon-ltx-production.mp4)" -gt 30000
              file neon-ltx-production.mp4
              ffprobe -v error -show_entries format=duration,size -of json neon-ltx-production.mp4
              echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "$R" | jq '{status,failureReason,seo}'
              exit 1
            fi
            sleep 8
          done
          echo 'Timed out waiting for LTX production video'; exit 1

      - name: Upload generated AI video
        uses: actions/upload-artifact@v4
        with:
          name: neon-ltx-production-video
          path: neon-ltx-production.mp4
          if-no-files-found: error
          retention-days: 7
