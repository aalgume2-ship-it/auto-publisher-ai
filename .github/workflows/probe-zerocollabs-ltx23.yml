name: inspect-ltx25-api

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-zerocollabs-ltx23.yml'
  workflow_dispatch:

permissions:
  statuses: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect official LTX 2.5 API
        run: |
          set -euo pipefail
          BASE='https://lightricks-ltx-2-5.hf.space'
          curl -LsS --retry 5 --retry-delay 3 "$BASE/gradio_api/info" -o info.json
          jq '.' info.json
          jq -e '.named_endpoints | length > 0' info.json >/dev/null
      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure; [ "$JOB_STATUS" = success ] && STATE=success
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -nc --arg state "$STATE" --arg context 'ltx25-api-inspect' --arg desc "Official LTX 2.5 API inspect: $JOB_STATUS" --arg target "$RUN_URL" '{state:$state,context:$context,description:$desc,target_url:$target}' >/tmp/status.json
          curl -fLsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'content-type: application/json' --data @/tmp/status.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
