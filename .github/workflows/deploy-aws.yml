name: deploy-aws

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'infra/aws/**'
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-aws.yml'

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  STACK_NAME: autocreator-prod
  ENVIRONMENT_NAME: prod
  API_REPOSITORY: autocreator/api
  WORKER_REPOSITORY: autocreator/worker

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity and inspect existing deployment
        id: aws
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "region=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1 \
            && echo "Existing CloudFormation stack found; it will be updated in place." \
            || echo "No existing stack found; the declared production stack will be created."
          aws ecs list-clusters --region "$AWS_REGION"
          aws ecr describe-repositories --region "$AWS_REGION" >/dev/null 2>&1 || true
          aws ec2 describe-instances --region "$AWS_REGION" --filters Name=instance-state-name,Values=pending,running,stopping,stopped --query 'Reservations[].Instances[].{Id:InstanceId,State:State.Name,Tags:Tags}'
          aws rds describe-db-instances --region "$AWS_REGION" --query 'DBInstances[].{Id:DBInstanceIdentifier,Status:DBInstanceStatus}' || true
          aws elasticache describe-cache-clusters --region "$AWS_REGION" --query 'CacheClusters[].{Id:CacheClusterId,Status:CacheClusterStatus}' || true
          aws elbv2 describe-load-balancers --region "$AWS_REGION" --query 'LoadBalancers[].{Name:LoadBalancerName,State:State.Code}' || true

      - name: Ensure ECR repositories
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          for repository in "$API_REPOSITORY" "$WORKER_REPOSITORY"; do
            aws ecr describe-repositories --repository-names "$repository" --region "$AWS_REGION" >/dev/null 2>&1 || \
              aws ecr create-repository \
                --repository-name "$repository" \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256 \
                --region "$AWS_REGION" >/dev/null
          done

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable service images
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          API_IMAGE="${REGISTRY}/${API_REPOSITORY}:${GITHUB_SHA}"
          WORKER_IMAGE="${REGISTRY}/${WORKER_REPOSITORY}:${GITHUB_SHA}"
          docker build --pull -f Dockerfile.api -t "$API_IMAGE" .
          docker build --pull -f Dockerfile.worker -t "$WORKER_IMAGE" .
          docker push "$API_IMAGE"
          docker push "$WORKER_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

      - name: Validate and deploy CloudFormation in place
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          deployment_diagnostics() {
            exit_code=$?
            set +e
            echo "::error::CloudFormation deployment failed; collecting change-set and stack diagnostics."
            CHANGE_SET_ID="$(aws cloudformation list-change-sets \
              --stack-name "$STACK_NAME" --region "$AWS_REGION" \
              --query 'reverse(sort_by(Summaries,&CreationTime))[0].ChangeSetId' \
              --output text 2>/dev/null)"
            if [ -n "$CHANGE_SET_ID" ] && [ "$CHANGE_SET_ID" != "None" ]; then
              aws cloudformation describe-change-set \
                --change-set-name "$CHANGE_SET_ID" --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --query '{Status:Status,StatusReason:StatusReason,ExecutionStatus:ExecutionStatus,Changes:Changes}'
            else
              echo "No CloudFormation change set was available to describe."
            fi
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" --region "$AWS_REGION" --max-items 30 \
              --query 'StackEvents[].{Time:Timestamp,LogicalId:LogicalResourceId,Type:ResourceType,Status:ResourceStatus,Reason:ResourceStatusReason}' \
              2>/dev/null || true
            exit "$exit_code"
          }
          trap deployment_diagnostics ERR
          RUNTIME_SECRET_NAME="autocreator/prod/runtime"
          if aws secretsmanager describe-secret --secret-id "$RUNTIME_SECRET_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            existing="$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_NAME" --region "$AWS_REGION" --query SecretString --output text)"
            DEPLOY_JWT="$(jq -r '.AUTH_JWT_SECRET // empty' <<<"$existing")"
            DEPLOY_MASTER="$(jq -r '.SECRETS_MASTER_KEY // empty' <<<"$existing")"
          else
            DEPLOY_JWT=""
            DEPLOY_MASTER=""
          fi
          if [ "${#DEPLOY_JWT}" -lt 64 ]; then DEPLOY_JWT="$(openssl rand -hex 32)"; fi
          if [ "${#DEPLOY_MASTER}" -lt 64 ]; then DEPLOY_MASTER="$(openssl rand -hex 32)"; fi
          echo "::add-mask::$DEPLOY_JWT"
          echo "::add-mask::$DEPLOY_MASTER"
          aws cloudformation validate-template \
            --template-body file://infra/aws/cloudformation.yml \
            --region "$AWS_REGION" >/dev/null
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/aws/cloudformation.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION" \
            --parameter-overrides \
              EnvironmentName="$ENVIRONMENT_NAME" \
              ApiImage="$API_IMAGE" \
              WorkerImage="$WORKER_IMAGE" \
              AuthJwtSecret="$DEPLOY_JWT" \
              SecretsMasterKey="$DEPLOY_MASTER"

      - name: Read deployment outputs
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          output() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          echo "API_URL=$(output ApiUrl)" >> "$GITHUB_ENV"
          echo "CLUSTER=$(output ClusterName)" >> "$GITHUB_ENV"
          echo "API_SERVICE=$(output ApiServiceName)" >> "$GITHUB_ENV"
          echo "WORKER_SERVICE=$(output WorkerServiceName)" >> "$GITHUB_ENV"
          echo "API_TASK_DEFINITION=$(output ApiTaskDefinitionArn)" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNETS=$(output PrivateSubnetIds)" >> "$GITHUB_ENV"
          echo "API_SECURITY_GROUP=$(output ApiSecurityGroupId)" >> "$GITHUB_ENV"
          echo "RUNTIME_SECRET=$(output RuntimeSecretArn)" >> "$GITHUB_ENV"

      - name: Initialize runtime secret without replacing provider credentials
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          current="$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET" --region "$AWS_REGION" --query SecretString --output text)"
          jwt="$(openssl rand -hex 32)"
          master="$(openssl rand -hex 32)"
          updated="$(jq -c \
            --arg jwt "$jwt" --arg master "$master" --arg api "$API_URL" \
            '.AUTH_JWT_SECRET = (if (.AUTH_JWT_SECRET // "") | startswith("CHANGE_ME") then $jwt else .AUTH_JWT_SECRET end)
             | .SECRETS_MASTER_KEY = (if (.SECRETS_MASTER_KEY // "") | startswith("CHANGE_ME") then $master else .SECRETS_MASTER_KEY end)
             | .PUBLIC_API_URL = $api
             | .OPENAI_API_KEY //= "" | .GROQ_API_KEY //= "" | .GEMINI_API_KEY //= ""
             | .RUNWAY_API_KEY //= "" | .LUMA_API_KEY //= "" | .FAL_KEY //= ""
             | .GOOGLE_CLIENT_ID //= "" | .GOOGLE_CLIENT_SECRET //= ""
             | .TIKTOK_CLIENT_KEY //= "" | .TIKTOK_CLIENT_SECRET //= ""
             | .META_APP_ID //= "" | .META_APP_SECRET //= ""
             | .STRIPE_SECRET_KEY //= "" | .STRIPE_WEBHOOK_SECRET //= ""' <<<"$current")"
          aws secretsmanager put-secret-value \
            --secret-id "$RUNTIME_SECRET" \
            --secret-string "$updated" \
            --region "$AWS_REGION" >/dev/null

      - name: Apply Prisma migrations as a one-off private ECS task
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          NETWORK="awsvpcConfiguration={subnets=[${PRIVATE_SUBNETS}],securityGroups=[${API_SECURITY_GROUP}],assignPublicIp=DISABLED}"
          TASK_ARN="$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$API_TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides '{"containerOverrides":[{"name":"api","command":["pnpm","db:migrate"]}]}' \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' --output text)"
          test -n "$TASK_ARN" && test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"
          EXIT_CODE="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION" --query 'tasks[0].containers[0].exitCode' --output text)"
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION" \
              --query 'tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,reason:reason,exitCode:exitCode}}'
            exit 1
          fi

      - name: Restart services with initialized configuration and wait healthy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --force-new-deployment --region "$AWS_REGION" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "$WORKER_SERVICE" --force-new-deployment --region "$AWS_REGION" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API_SERVICE" "$WORKER_SERVICE" --region "$AWS_REGION"
          for service in "$API_SERVICE" "$WORKER_SERVICE"; do
            TASK="$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$service" --desired-status RUNNING --region "$AWS_REGION" --query 'taskArns[0]' --output text)"
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --region "$AWS_REGION" \
              --query 'tasks[0].{lastStatus:lastStatus,healthStatus:healthStatus,containers:containers[].{name:name,lastStatus:lastStatus,healthStatus:healthStatus}}'
            test "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --region "$AWS_REGION" --query 'tasks[0].healthStatus' --output text)" = "HEALTHY"
          done

      - name: Production API smoke tests
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "$API_URL/health"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 "$API_URL/health/ready"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$API_URL/health/providers"
          echo "Production API endpoint: $API_URL"
