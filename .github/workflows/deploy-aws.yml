name: deploy-aws
# Operations restart: 2026-08-15T22:47:00+03:00

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'Dockerfile.api'
      - 'Dockerfile.worker'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-aws.yml'

concurrency:
  group: deploy-aws-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLUSTER: autocreator-prod-recovery
  API_SERVICE: autocreator-prod-recovery-api
  WORKER_SERVICE: autocreator-prod-recovery-worker
  API_REPOSITORY: autocreator/api
  WORKER_REPOSITORY: autocreator/worker

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify recovery production services only
        id: aws
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          for service in "$API_SERVICE" "$WORKER_SERVICE"; do
            status="$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --region "$AWS_REGION" --query 'services[0].status' --output text)"
            test "$status" = "ACTIVE"
          done
          echo 'Deployment is intentionally ECS-only. CloudFormation, RDS, Redis, VPC and Secrets are not mutated.'

      - name: Ensure ECR repositories
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          for repository in "$API_REPOSITORY" "$WORKER_REPOSITORY"; do
            aws ecr describe-repositories --repository-names "$repository" --region "$AWS_REGION" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "$repository" --image-scanning-configuration scanOnPush=true --encryption-configuration encryptionType=AES256 --region "$AWS_REGION" >/dev/null
          done

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          API_IMAGE="${REGISTRY}/${API_REPOSITORY}:${GITHUB_SHA}"
          WORKER_IMAGE="${REGISTRY}/${WORKER_REPOSITORY}:${GITHUB_SHA}"
          docker build --pull -f Dockerfile.api -t "$API_IMAGE" .
          docker build --pull -f Dockerfile.worker -t "$WORKER_IMAGE" .
          docker push "$API_IMAGE"
          docker push "$WORKER_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

      - name: Clone task definitions and change image only
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          update_task() {
            service="$1" image="$2" outvar="$3"
            current="$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" --region "$AWS_REGION" --query 'services[0].taskDefinition' --output text)"
            aws ecs describe-task-definition --task-definition "$current" --region "$AWS_REGION" --query taskDefinition --output json > current.json
            jq --arg image "$image" '
              .containerDefinitions[0].image = $image
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            ' current.json > next.json
            next="$(aws ecs register-task-definition --cli-input-json file://next.json --region "$AWS_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)"
            echo "$outvar=$next" >> "$GITHUB_ENV"
          }
          update_task "$API_SERVICE" "$API_IMAGE" API_TASK
          update_task "$WORKER_SERVICE" "$WORKER_IMAGE" WORKER_TASK

      - name: Deploy recovery services
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$API_SERVICE" --task-definition "$API_TASK" --region "$AWS_REGION" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "$WORKER_SERVICE" --task-definition "$WORKER_TASK" --region "$AWS_REGION" >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$API_SERVICE" "$WORKER_SERVICE" --region "$AWS_REGION"
          aws ecs describe-services --cluster "$CLUSTER" --services "$API_SERVICE" "$WORKER_SERVICE" --region "$AWS_REGION" \
            --query 'services[].{Service:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount}' --output table

      - name: Production health through public site
        run: |
          set -euo pipefail
          SITE='https://auto-publisher-ai-web.vercel.app'
          curl -fLsS --retry 12 --retry-all-errors --retry-delay 5 "$SITE/api/v1/health/live"
          echo
          curl -fLsS --retry 12 --retry-all-errors --retry-delay 5 "$SITE/api/v1/health/ready"
          echo
