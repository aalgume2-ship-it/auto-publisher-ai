name: video-recovery-final

on:
  push:
    branches: [main]
    paths: ['.github/workflows/video-recovery-final.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE: https://auto-publisher-ai-web.vercel.app
    steps:
      - name: Install media verifier
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --silent ffprobe-static@3.1.0 ffmpeg-static@5.3.0
          echo "$(dirname "$(node -p "require('ffprobe-static').path")")" >> "$GITHUB_PATH"
          echo "$(dirname "$(node -p "require('ffmpeg-static')")")" >> "$GITHUB_PATH"

      - name: Wait for deployed worker and recover video
        id: recover
        run: |
          set -euo pipefail
          curl -fLsS --retry 5 --retry-delay 3 "$SITE/api/v1/health/live"
          curl -fLsS --retry 5 --retry-delay 3 "$SITE/api/v1/health/ready"

          for ATTEMPT in $(seq 1 12); do
            echo "=== production attempt $ATTEMPT/12 ==="
            ID="${GITHUB_RUN_ID}-${ATTEMPT}-$(date +%s)-$RANDOM"
            EMAIL="recovery-$ID@trial.lumen.app"
            PASSWORD="Smoke${ID//-/}Aa9!xZ7#"
            AUTH_BODY=$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" --arg n "Recovery $ATTEMPT" '{email:$e,password:$p,displayName:$n,locale:"ar",timezone:"Asia/Riyadh"}')
            AUTH=$(curl -fLsS -H 'content-type: application/json' -H "Idempotency-Key: auth-$ID" -d "$AUTH_BODY" "$SITE/api/v1/auth/register")
            TOKEN=$(jq -r '.tokens.accessToken // empty' <<<"$AUTH")
            ORG=$(jq -r '.workspace.id // empty' <<<"$AUTH")
            test -n "$TOKEN"; test -n "$ORG"

            SERIES=$(curl -fLsS -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: series-$ID" -d '{"name":"قصة مدينة النيون الواقعية","niche":"photorealistic cinematic story","language":"ar"}' "$SITE/api/v1/organizations/$ORG/series")
            SID=$(jq -r '.id // empty' <<<"$SERIES"); test -n "$SID"
            PROMPT='مدينة ليلية مضاءة بالنيون، شخص يمشي بشكل طبيعي في شارع مبلل بالمطر، انعكاسات واقعية على الإسفلت، تصوير سينمائي احترافي بحركة كاميرا تتبعه، إضاءة فيزيائية واقعية، تفاصيل بشرية طبيعية، بدون نصوص أو شعارات'
            BODY=$(jq -nc --arg k "$PROMPT" '{keyword:$k,targetSeconds:20}')
            VIDEO=$(curl -fLsS -H 'content-type: application/json' -H "Authorization: Bearer $TOKEN" -H "Idempotency-Key: video-$ID" -d "$BODY" "$SITE/api/v1/organizations/$ORG/series/$SID/videos")
            VID=$(jq -r '.video.id // .id // empty' <<<"$VIDEO"); test -n "$VID"
            echo "video_id=$VID"

            STATE=''
            RESULT=''
            for POLL in $(seq 1 48); do
              RESULT=$(curl -fLsS -H "Authorization: Bearer $TOKEN" "$SITE/api/v1/organizations/$ORG/videos/$VID")
              STATE=$(jq -r '.status // empty' <<<"$RESULT")
              STEP=$(jq -r '.seo.step // ""' <<<"$RESULT")
              PROGRESS=$(jq -r '.seo.progress // ""' <<<"$RESULT")
              echo "attempt=$ATTEMPT poll=$POLL status=$STATE step=$STEP progress=$PROGRESS"
              if [ "$STATE" = READY ] || [ "$STATE" = FAILED ] || [ "$STATE" = ERROR ] || [ "$STATE" = CANCELLED ]; then break; fi
              sleep 5
            done

            if [ "$STATE" = READY ]; then
              echo "READY: reconstructing byte-exact MP4"
              : > final-realistic-video.mp4
              START=0; TOTAL=-1; EXPECTED=''
              while [ "$TOTAL" -lt 0 ] || [ "$START" -lt "$TOTAL" ]; do
                C=$(curl -fLsS --retry 4 -H "Authorization: Bearer $TOKEN" "$SITE/api/v1/organizations/$ORG/videos/$VID/stream-chunk?start=$START&size=524286")
                S=$(jq -r .start <<<"$C"); E=$(jq -r .end <<<"$C"); TOTAL=$(jq -r .total <<<"$C")
                test "$S" -eq "$START"
                if [ "$START" -eq 0 ]; then EXPECTED=$(jq -r '.sha256 // empty' <<<"$C"); fi
                jq -r .base64 <<<"$C" | base64 --decode >> final-realistic-video.mp4
                START=$E
              done
              SIZE=$(stat -c%s final-realistic-video.mp4)
              test "$SIZE" -gt 30000; test "$SIZE" -eq "$TOTAL"
              ACTUAL=$(sha256sum final-realistic-video.mp4 | awk '{print $1}')
              if [ -n "$EXPECTED" ]; then test "$ACTUAL" = "$EXPECTED"; fi
              ffprobe -v error -show_entries stream=index,codec_name,codec_type,width,height,duration -show_entries format=format_name,duration,size -of json final-realistic-video.mp4 | tee ffprobe.json
              jq -e '.streams|any(.codec_type=="video")' ffprobe.json >/dev/null
              jq -e '(.format.duration|tonumber)>0' ffprobe.json >/dev/null
              ffmpeg -v error -i final-realistic-video.mp4 -vf "select='eq(n,0)+eq(n,5)+eq(n,10)'" -vsync 0 proof-frame-%02d.png
              sha256sum proof-frame-*.png | tee motion-proof.txt
              test "$(awk '{print $1}' motion-proof.txt | sort -u | wc -l)" -ge 2
              printf '%s\n' "$ACTUAL" > video-sha256.txt
              printf '%s\n' "$VID" > video-id.txt
              echo "success_attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            REASON=$(jq -r '.failureReason // "generation did not reach READY"' <<<"$RESULT")
            echo "failure_reason=$REASON"
            if grep -q 'hf-ltx-distilled-official' <<<"$REASON"; then
              echo 'New worker is deployed; free GPU was transiently unavailable. Retrying.'
              sleep 20
            elif grep -q 'hf-ltx-distilled generation' <<<"$REASON"; then
              echo 'Old worker still serving. Waiting for ECS rollout.'
              sleep 45
            else
              echo 'Transient production generation failure. Retrying.'
              sleep 30
            fi
          done
          echo 'No verified READY video after all recovery attempts.'
          exit 1

      - name: Upload final verified MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-realistic-video
          path: |
            final-realistic-video.mp4
            ffprobe.json
            motion-proof.txt
            proof-frame-*.png
            video-sha256.txt
            video-id.txt
          retention-days: 7

      - name: Publish final recovery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure; [ "$JOB_STATUS" = success ] && STATE=success
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -nc --arg state "$STATE" --arg target "$RUN_URL" --arg desc "Final realistic MP4 recovery: $JOB_STATUS" --arg context "final-realistic-video" '{state:$state,target_url:$target,description:$desc,context:$context}' >/tmp/status.json
          curl -fLsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'content-type: application/json' --data @/tmp/status.json "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
