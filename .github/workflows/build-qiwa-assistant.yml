name: Build Qiwa Assistant

on:
  push:
    branches: ["main"]
    paths:
      - "tools/qiwa-assistant/**"
      - ".github/workflows/build-qiwa-assistant.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/qiwa-assistant/**"
      - ".github/workflows/build-qiwa-assistant.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable EXE
        run: dotnet publish tools/qiwa-assistant/QiwaAssistant.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/qiwa-assistant

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/qiwa-assistant/* -DestinationPath QiwaAssistant-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: QiwaAssistant-Windows
          path: QiwaAssistant-Windows.zip
          retention-days: 30

      - name: Publish stable download release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view qiwa-assistant-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create qiwa-assistant-latest QiwaAssistant-Windows.zip --title "Qiwa Assistant for Windows" --notes "Latest Windows build of Qiwa Assistant." --target "$env:GITHUB_SHA"
          } else {
            gh release upload qiwa-assistant-latest QiwaAssistant-Windows.zip --clobber
          }
