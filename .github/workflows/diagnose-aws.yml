name: diagnose-aws

# Safe read-only diagnostics for autocreator-prod.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-aws.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Show CloudFormation stack failure details
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STACK_NAME: autocreator-prod
        run: |
          set -u
          echo '=== STACK STATUS ==='
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].{Status:StackStatus,Reason:StackStatusReason}' \
            --output table || true

          echo '=== RECENT FAILED/ROLLBACK EVENTS ==='
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED') || contains(ResourceStatus, 'ROLLBACK')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo '=== MOST RECENT EVENTS ==='
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --max-items 40 \
            --query 'StackEvents[].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table || true
